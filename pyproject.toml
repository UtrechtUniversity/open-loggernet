[project]
name = "openloggernet"
version = "0.2.0"
description = "Open replacement for parts of the Campbell Scientific LoggerNet toolchain: PakBus/BMP5 client, compiler runner and logger CLIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Utrecht University" }]
requires-python = ">=3.14"
dependencies = ["pyserial>=3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/UtrechtUniversity/open-loggernet"

[project.scripts]
oln = "openloggernet.cli:main"
oln-gui = "openloggernet.gui:main"
flash = "openloggernet.flash:main"
read_values = "openloggernet.read_values:main"
set_value = "openloggernet.set_value:main"
collect_data = "openloggernet.collect_data:main"
logger_clock = "openloggernet.logger_clock:main"
comusb_capture = "openloggernet.comusb_capture:main"

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.12",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pyrefly==1.3.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E702", "E731", "E741", "B905"]

[tool.pyrefly]
preset = "default"
python-version = "3.15"
project-includes = ["src", "tests"]
