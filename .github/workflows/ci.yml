name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest

  # main publishes to PyPI when the version in pyproject.toml is new; dev publishes every push to
  # TestPyPI as <version>.dev<run number>. Both use trusted publishing (README, "Releasing").
  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - if: github.ref_name == 'dev'
        run: uv version --frozen "$(uv version --short).dev${{ github.run_number }}"
      - run: uv build
      - if: github.ref_name == 'main'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
      - if: github.ref_name == 'dev'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
